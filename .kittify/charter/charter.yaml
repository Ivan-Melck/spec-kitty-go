  - id: STYLEGUIDE:adversarial-squad-cadence
    kind: styleguide
    title: Adversarial Squad Cadence
    summary: "Run a bounded multi-profile adversarial squad at each planning point-cut as strong guidance, not a gate. A mission is not blocked for skipping the squad.\n"
    source_path: ''
    local_path: _LIBRARY/styleguide-adversarial-squad-cadence.md
  - id: STYLEGUIDE:aggregate-design-rules
    kind: styleguide
    title: Aggregate Design Rules
    summary: "Reference other aggregates by identity only: an aggregate must not hold a direct object reference to another aggregate. Use the other aggregate's ID instead to prevent transaction scope from spanning multiple aggregates."
    source_path: ''
    local_path: _LIBRARY/styleguide-aggregate-design-rules.md
  - id: STYLEGUIDE:given-when-then-authoring
    kind: styleguide
    title: Given-When-Then Scenario Authoring
    summary: 'A scenario has three parts: Given (the precondition/context), When (the single trigger), Then (the observable outcome). This is the same behavioural skeleton the specs in this repository already use — one scenario describes one behaviour.'
    source_path: ''
    local_path: _LIBRARY/styleguide-given-when-then-authoring.md
  - id: STYLEGUIDE:kitty-glossary-writing
    kind: styleguide
    title: Kitty Glossary Writing Styleguide
    summary: 'Clear, not clever: definitions exist to help the reader understand, not to demonstrate expertise.'
    source_path: ''
    local_path: _LIBRARY/styleguide-kitty-glossary-writing.md
  - id: STYLEGUIDE:mutation-aware-test-design
    kind: styleguide
    title: Mutation-Aware Test Design
    summary: 'Test boundary values: provide a test at the exact equality point for every >= or <= comparison, plus one step either side.'
    source_path: ''
    local_path: _LIBRARY/styleguide-mutation-aware-test-design.md
  - id: STYLEGUIDE:python-conventions
    kind: styleguide
    title: Python Conventions Styleguide
    summary: 'Guard clauses over nesting: validate inputs early and fail fast rather than wrapping logic in conditional branches.'
    source_path: ''
    local_path: _LIBRARY/styleguide-python-conventions.md
  - id: STYLEGUIDE:quadruple-a-test-format
    kind: styleguide
    title: Quadruple-A Test Format
    summary: 'A test has four phases: Arrange, Assumption checks, Act, Assert. Naming them turns a test into the canonical skeleton for pinning ONE behaviour.'
    source_path: ''
    local_path: _LIBRARY/styleguide-quadruple-a-test-format.md
  - id: STYLEGUIDE:test-desiderata-and-boundaries
    kind: styleguide
    title: Test Desiderata and Clear Test Boundaries
    summary: 'Desiderata are trade-offs: choose which properties a given test optimizes; do not pretend one test maximizes all twelve at once.'
    source_path: ''
    local_path: _LIBRARY/styleguide-test-desiderata-and-boundaries.md
  - id: STYLEGUIDE:testing-principles
    kind: styleguide
    title: Testing Principles Styleguide
    summary: 'Fast: tests execute quickly enough that running them after every small change is not a burden.'
    source_path: ''
    local_path: _LIBRARY/styleguide-testing-principles.md
  - id: STYLEGUIDE:tiered-standards
    kind: styleguide
    title: Tiered Coding Standards
    summary: 'Rigour must match risk: the closer a package is to mission-critical state management or runtime execution, the higher the quality bar it must meet.'
    source_path: ''
    local_path: _LIBRARY/styleguide-tiered-standards.md
  - id: TOOLGUIDE:contextive
    kind: toolguide
    title: Contextive
    summary: "Reference guide for using Contextive to manage ubiquitous language in software projects. Covers glossary file setup, term definition syntax, multi-context repository layouts, IDE integration, and alignment with Spec Kitty glossary curation workflows.\n"
    source_path: ''
    local_path: _LIBRARY/toolguide-contextive.md
  - id: TOOLGUIDE:efficient-local-tooling
    kind: toolguide
    title: Efficient Local Tooling
    summary: Operation-oriented guidance for using efficient local tools during repository work.
    source_path: ''
    local_path: _LIBRARY/toolguide-efficient-local-tooling.md
  - id: TOOLGUIDE:gherkin
    kind: toolguide
    title: The Gherkin Scenario Language
    summary: "Reference for the Gherkin DSL itself — the language, not any runner. Covers Feature, Background, Scenario, Scenario Outline, the Given/When/Then/And/But steps, Examples tables, tags, and doc strings / data tables. Explicitly scoped to the notation only; the runner that executes Gherkin (Cucumber, behave, SpecFlow, and others) is out of scope and named only to draw the boundary.\n"
    source_path: ''
    local_path: _LIBRARY/toolguide-gherkin.md
  - id: TOOLGUIDE:python-mutation-tools
    kind: toolguide
    title: Python Mutation Testing with mutmut
    summary: "Operator reference and mutmut workflow for Python mutation testing. Covers Python-specific mutation families (identity operators, membership, floor division, any/all, break/continue) and the mutmut run/browse/apply cycle.\n"
    source_path: ''
    local_path: _LIBRARY/toolguide-python-mutation-tools.md
  - id: TOOLGUIDE:python-review-checks
    kind: toolguide
    title: Python Review Checks
    summary: "Catalog of automated checks a reviewer should run or verify have been run before approving Python code. Organized by category: formatting, linting, type safety, architecture, security, and test quality.\n"
    source_path: ''
    local_path: _LIBRARY/toolguide-python-review-checks.md
  - id: TOOLGUIDE:sonar
    kind: toolguide
    title: SonarQube Static Analysis and Quality Gate
    summary: "Operator reference for SonarQube static analysis and its quality gate. Covers the four measure families (new-code coverage, code smells / maintainability, security hotspots and vulnerabilities, duplication), why the gate is evaluated on NEW code rather than the whole project, and the loopback-safe handling of a local Sonar or control-plane URL (do not force HTTPS on 127.0.0.1).\n"
    source_path: ''
    local_path: _LIBRARY/toolguide-sonar.md
  - id: TOOLGUIDE:typescript-mutation-tools
    kind: toolguide
    title: TypeScript Mutation Testing with Stryker
    summary: "Operator reference and Stryker workflow for TypeScript/JavaScript mutation testing. Covers JS/TS-specific mutation families (optional chaining ?., nullish coalescing ??, some/every, array literals) and the Stryker run/incremental/HTML-report cycle.\n"
    source_path: ''
    local_path: _LIBRARY/toolguide-typescript-mutation-tools.md
  - id: PROCEDURE:adversarial-squad-deployment
    kind: procedure
    title: Adversarial Squad Deployment
    summary: "Deploy a small, bounded set of profile-loaded subagents in parallel at high-leverage review point-cuts so independent doctrine lenses converge on findings no single reviewer would catch. Turns review from one perspective into a cheap adversarial panel that resists laziness, accidental-pass, and single-lens blind spots. Optional and charter- or memory-activated — it enriches the flow, it does not gate it.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-adversarial-squad-deployment.md
  - id: PROCEDURE:bdd-scenario-lifecycle
    kind: procedure
    title: BDD Scenario Lifecycle
    summary: "Guide the Formulation, Automation, and Maintenance phases of the BDD cycle, picking up where the Example Mapping Workshop (Discovery phase) leaves off. Covers translating validated examples into Gherkin specifications, wiring them to executable step definitions, and maintaining them as living documentation as the system evolves. Toolchain-agnostic — applicable with Cucumber-JVM, Cucumber-JS, Behave, SpecFlow, or any Given/When/Then runner.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-bdd-scenario-lifecycle.md
  - id: PROCEDURE:event-storming-discovery
    kind: procedure
    title: Event Storming Discovery
    summary: "Discover domain events, commands, aggregates, policies, read models, and bounded context boundaries through a structured analysis of business flows. The procedure produces a shared domain model grounded in real business behaviour rather than technical assumptions. Based on Alberto Brandolini's Event Storming technique, adapted for agent-assisted discovery with human-in-charge validation at key decision points.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-event-storming-discovery.md
  - id: PROCEDURE:example-mapping-workshop
    kind: procedure
    title: Example Mapping Workshop
    summary: "Turn a behavior request into concrete rules, examples, and open questions that stakeholders and implementers can share as a canonical specification set.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-example-mapping-workshop.md
  - id: PROCEDURE:legacy-codebase-triage
    kind: procedure
    title: Legacy Codebase Triage
    summary: "Convert an unfamiliar brownfield codebase into a defensible action plan by gathering version-control evidence, overlaying structural and complexity signals, optionally classifying domains, and bucketing the resulting findings into fix-this-week, fix-this-quarter, do-not-worry, and parallelisable work. The output is a triage document that anchors subsequent planning conversations and ADRs; it is not a replacement for deeper investigation, only a fast, evidence-backed first pass.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-legacy-codebase-triage.md
  - id: PROCEDURE:mission-tracer-files
    kind: procedure
    title: Mission Tracer Files
    summary: "Give every mission a lightweight running log of tooling friction, approach evolution, and design rationale through three sparse tracer files. The files are seeded at mission start, appended to during implementation, and assessed at mission close. Captured friction and rationale feed the next mission's planning and make recurring tool and process gaps visible instead of repeatedly re-discovered.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-mission-tracer-files.md
  - id: PROCEDURE:post-merge-arch-gate-adjudication
    kind: procedure
    title: Post-Merge Arch-Gate Adjudication
    summary: "After merging one or more lane branches, architectural gate failures may appear that were not visible during per-lane review. This procedure distinguishes pre-existing failures (present on the mission base branch before any lane work) from regressions introduced by the merge. Correct adjudication prevents teams from either ignoring real regressions or blocking on failures they did not cause.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-post-merge-arch-gate-adjudication.md
  - id: PROCEDURE:red-main-release-discipline
    kind: procedure
    title: Red Main & Release Discipline
    summary: "Keep the mainline CI signal honest and authoritative for release. A red main is a true signal of known release-blocking (P0) defects, never something to hide by reverting an honest failure or declining a bug's reproduction test. Mainline CI status is the single authoritative release gate; expensive QA and manual testing are not spent on a known-broken base; and red main is worked down as top priority. Consensus policy (CEO/product owner, QA lead, maintainers); governing decision ADR 2026-07-17-1, operational guide docs/development/red-main-and-release-readiness.md.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-red-main-release-discipline.md
  - id: PROCEDURE:situational-assessment
    kind: procedure
    title: Situational Assessment
    summary: "Establish a shared, documented understanding of the context, stakeholders, constraints, and problem structure before any solution is designed or selected. A situational assessment ensures that architectural decisions are grounded in operational reality rather than technology preference, and that the trade-off assessments that follow address the right problem.\n"
    source_path: ''
    local_path: _LIBRARY/procedure-situational-assessment.md
