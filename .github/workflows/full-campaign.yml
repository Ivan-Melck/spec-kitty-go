name: full-campaign

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out committed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.7
          cache: true

      - name: Configure isolated mutable paths
        run: |
          echo "ARTIFACT_DIR=$RUNNER_TEMP/go-kitty3-full-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$RUNNER_TEMP/go-kitty3-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "GOCACHE=$RUNNER_TEMP/go-build-cache-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$RUNNER_TEMP/go-tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/process-tmp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Prepare isolated mutable paths
        run: mkdir -p "$ARTIFACT_DIR" "$BUILD_DIR" "$GOCACHE" "$GOTMPDIR" "$TMPDIR"

      - name: Verify ordinary-user namespace prerequisite
        run: bash scripts/ci/prepare-userns.sh

      - name: Record offline qualification boundary
        run: printf '%s\n' '{"hosted_credentials":"not_required","hosted_services":"not_required","runner":"github-hosted-linux"}' > "$ARTIFACT_DIR/runner-boundary.json"

      - name: Install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run exhaustive local-equivalent campaign
        shell: bash
        run: |
          set -uo pipefail
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          started_seconds=$(date +%s)
          set +e
          make full-campaign ARTIFACT_DIR="$ARTIFACT_DIR"
          status=$?
          set -e
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          finished_seconds=$(date +%s)
          duration_seconds=$((finished_seconds - started_seconds))
          verdict=pass
          if [ "$status" -ne 0 ]; then verdict=fail; fi
          printf '{"schema_version":1,"campaign":"full_campaign","commit":"%s","started_at":"%s","finished_at":"%s","duration_seconds":%d,"process_exit":%d,"verdict":"%s"}\n' \
            "$GITHUB_SHA" "$started_at" "$finished_at" "$duration_seconds" "$status" "$verdict" > "$ARTIFACT_DIR/campaign-summary.json"
          exit "$status"

      - name: Upload full campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-campaign-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
