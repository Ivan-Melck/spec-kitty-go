name: release

# Publishes cross-platform executables for a version tag (v<CLI version>).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.7
          cache: true

      - name: Check the tag names the CLI version
        id: version
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/app/app.go)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match CLI version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build archives and checksums
        run: scripts/build-release.sh "${{ steps.version.outputs.version }}" dist

      - name: Smoke-test the Linux archive
        run: |
          tar -xzf "dist/spec-kitty_${{ steps.version.outputs.version }}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          HOME="$RUNNER_TEMP/home" SPEC_KITTY_NO_UPGRADE_CHECK=1 \
            "$RUNNER_TEMP/spec-kitty_${{ steps.version.outputs.version }}_linux_amd64/spec-kitty" --version

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *a* | *b* | *rc*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "spec-kitty $VERSION" --generate-notes --verify-tag $prerelease
