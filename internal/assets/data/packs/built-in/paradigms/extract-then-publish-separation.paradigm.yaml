schema_version: "1.0"
id: extract-then-publish-separation
name: Extract-Then-Publish Separation
summary: >
  The meeting-minutes workflow separates extraction, validation, and chat
  presentation from optional deterministic publishing. Those stages must
  never be collapsed.

  Extraction (agent-powered, non-deterministic) converts an unstructured
  transcript into structured minutes, validates them (format contract plus
  ACTION_ITEM_ATTRIBUTION), and posts the result as Markdown in the
  originating chat. That validated Markdown is the canonical content.
  This stage is the mandatory default. It requires no wiki publish credentials.
  Unresolved attribution gaps are asked about in the same chat before any
  final minutes are returned and before any publish handoff.

  Publishing is optional, human-operated, and occurs only when the user
  explicitly requests it and identifies a wiki/knowledge-base destination.
  Rendering for that target is deterministic: it reuses the same validated
  Markdown already shown in chat. No second extraction. No LLM in the
  render/publish path. Chat-only runs skip this stage entirely.

  This separation has three concrete consequences:

  1. Chat delivery does not depend on a wiki. A user who only wants minutes
     in the originating chat never needs publish-surface credentials.

  2. Validation gates sit before both chat return and optional publish
     handoff. Ownerless action items stop the workflow at the boundary.

  3. Agent extraction cost is incurred once per meeting. The validated
     Markdown is the durable content. Re-publishing that same Markdown
     does not require a second extraction.

  Never merge extraction and publishing into a single step. Never call the
  LLM from inside the publish path. Never treat `.minutes.json` or
  `.wiki.txt` as mandatory artifacts; the validated Markdown in chat is
  canonical.
