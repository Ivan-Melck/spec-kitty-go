schema_version: "1.0"
id: MINUTES_STAND_ALONE
title: Minutes must stand alone
intent: >
  Meeting minutes are not a reminder for people who attended — they are the
  authoritative record for people who did not. Every set of minutes must be
  independently legible: a reader who was not in the room must be able to
  understand what was discussed, what was decided, and what action has been
  assigned, without access to the recording, the transcript, or the attendees.
enforcement: required
scope: >
  Applies to all meeting minutes produced by the meeting-minutes-pipeline
  procedure and any agent or process that generates minutes for delivery as
  a stand-alone Markdown response in the originating chat, including
  the same Markdown reused for optional wiki publication.
procedures:
  - >
    During extraction, prefer a complete short phrase over an abbreviated
    fragment that only makes sense with prior context. During review, test each
    note and decision by asking: "Would someone who missed this meeting
    understand this without asking a follow-up question?" If the answer is no,
    the note is incomplete.
  - >
    Name the thing being discussed, not a pronoun for it. State the decision, not
    a reference to a previous conversation. Name the owner of every action, not
    "the team" or "TBD". If a term is ambiguous without context, spell it out.
  - >
    Brevity and self-sufficiency are complementary: a well-written note is both
    short and complete. Do not add verbosity to achieve self-sufficiency — add
    the missing context instead.
integrity_rules:
  - "Notes that presuppose knowledge the reader was not in the room to acquire are incomplete."
  - "Context-dependence is the failure mode, not length — reject fragments that require attendance to decode."
