schema_version: "1.0"
id: meeting-minutes-format
title: Meeting minutes format
scope: docs
principles:
  - >
    Two output formats. This styleguide governs both minutes formats the
    Minutes Mahad agent can produce, and the agent asks the user which one to
    use before agenda resolution or extraction (see meeting-minutes-pipeline,
    step "Select minutes format"). Format 1 — DECISION MINUTES — is the executive record for
    decision- and action-oriented meetings (Attendance / Minutes table /
    Action Items; action attribution is a hard gate). Format 2 — DISCUSSION
    NOTES — is a stand-alone briefing for discussion-oriented meetings
    (Attendance / Topics Discussed / optional Action Items). The shared
    principles below (title suffix, em-dash, stand-alone readability, no
    invented content) apply to both; the format-specific principles are
    labelled "Decision minutes:" or "Discussion notes:".
  - >
    Companion templates. Decision minutes use meeting-minutes
    (templates/writing/meeting-minutes.md); discussion notes use
    meeting-discussion-notes (templates/writing/meeting-discussion-notes.md).
    Use the template matching the selected format as the canonical Markdown
    scaffold for the originating chat response (and when manually
    authoring or reviewing minutes). The same validated Markdown is reused if
    the user later requests optional wiki publication. Each template is
    pre-structured to match this styleguide's section order and layout for its
    format.
  - >
    Decision minutes:
    Document title uses the pattern "{Meeting Name} — Minutes" (em-dash, not hyphen).
    The suffix " — Minutes" is always appended so the response is identifiable
    in the originating chat, and so an optionally published wiki page is
    identifiable in search and parent-page task roll-ups, without opening the
    transcript.
  - >
    Decision minutes:
    Three sections in fixed order: Attendance, Minutes, Action Items. Do not
    reorder, rename, or merge sections. The fixed order is the format contract
    for stand-alone minutes delivered in chat. When optionally published, the
    same order is required for wiki task roll-up (action items aggregate
    to the parent page only when they appear in the Action Items section).
  - >
    Decision minutes:
    The Minutes section is a table with five columns in order: #, Agenda Item,
    Notes, Decisions, Presenter. Do not add, remove, or reorder columns. Each
    row is one agenda item (or one discovered topic in agenda-less mode).
  - >
    Decision minutes:
    Notes brevity rule: at most 3–4 bullet phrases per agenda item, each
    approximately 6–14 words. These are executive minutes — capture only the
    major talking point of each item, not the discussion that led to it.
    Separate multiple bullets with " / " in the stored string.
  - >
    Decision minutes:
    Decisions column: one short line per decision, outcome only. Add
    "— because <reason>" only if the reason was explicitly stated in the meeting
    and is essential to understanding the decision. If no decision was reached,
    leave the cell empty. Do not narrate the debate.
  - >
    Discussion notes:
    Document title uses the pattern "{Meeting Name} — Discussion Notes"
    (em-dash, not hyphen). The " — Discussion Notes" suffix distinguishes this
    format from decision minutes at a glance in the originating chat and in any
    optionally published wiki page, without opening the transcript.
  - >
    Discussion notes:
    Two sections in fixed order — Attendance, Topics Discussed — plus an
    OPTIONAL third section, Action Items, included only when concrete actions
    were raised. Do not reorder or rename the sections. If no actions came up,
    omit the Action Items section entirely rather than emitting an empty table.
  - >
    Discussion notes:
    The Topics Discussed section is NOT a table. It is one "### {Topic}" heading
    per discussed topic (aim for 3–8 topics), each followed by a bullet list.
    Add an italic "_Presenter: {Name}_" line under a heading only when one
    person clearly led that topic; omit it for open discussion.
  - >
    Discussion notes:
    Per-topic bullets are a stand-alone summary, not the executive one-liner of
    decision minutes and not a transcript. Write complete phrases — typically
    3–7 bullets per topic, no hard word cap — that let a reader who was not
    present understand what was covered, the reasoning, and where it landed
    (including open questions). Capture substance over play-by-play; do not
    reproduce the back-and-forth turn by turn.
  - >
    Discussion notes:
    Action Items are OPTIONAL — omit the section when nothing actionable arose.
    But any action that IS recorded must still carry a named owner
    (ACTION_ITEM_ATTRIBUTION applies to every action present, in either format).
    The absence of actions is valid for discussion notes; an ownerless action
    is not.
  - >
    Action items have two representations of the same contract:
    (1) Extraction string: "Owner Name — task description" with an em-dash.
    If a deadline was stated: "Owner Name — task description (by <deadline>)".
    Separate multiple actions from one agenda item with " / ".
    (2) Rendered Markdown table (canonical for chat and wiki): columns
    Owner | Action | Deadline. Split the extraction string so Owner is the
    name before the em-dash, Action is the task text without the "(by …)"
    suffix, and Deadline is the stated deadline or empty. Do not leave the
    combined "Owner — task" string in the Owner column. Owner is mandatory
    (see ACTION_ITEM_ATTRIBUTION directive).
  - >
    Attendance section: a single-column table listing the full name of every
    speaker who actually spoke in the transcript, as their name appears in the
    transcript. Do not infer or guess attendees from context — only speakers
    with at least one utterance are listed.

patterns:
  - name: Well-formed agenda item row
    description: >
      A row that captures the major point of a topic in brief, states the
      decision cleanly, and attributes every action. Readable without having
      attended the meeting.
    good_example: |
      | 3 | wiki publishing strategy | API-first approach chosen / PAT auth preferred over OAuth for initial release | Use PAT for V1; revisit OAuth post-launch | Alex Rivera — document PAT setup guide (by Friday) | Jordan Lee |
    bad_example: |
      | 3 | wiki publishing | We discussed several options and decided to go with the approach that was mentioned earlier. There was a lot of back and forth. | TBD | The team | Jordan |

  - name: Document title
    description: >
      Decision minutes use the " — Minutes" suffix; discussion notes use the
      " — Discussion Notes" suffix. Both use an em-dash, never a hyphen.
    good_example: |
      SDD Governance Working Group — Minutes
      Platform Architecture Sync — Discussion Notes
    bad_example: |
      SDD Governance Working Group Meeting Notes
      SDD Governance Working Group - Minutes

  - name: Well-formed discussion topic
    description: >
      A topic heading followed by complete-phrase bullets that brief a reader
      who was not present: what was covered, the reasoning, and where it landed
      (including any open question). Fuller than an executive one-liner, but
      still a summary — not a turn-by-turn transcript.
    good_example: |
      ### App hosting tiers

      - Template repositories plus a shared CI library are the intended integration path
      - Open question: how many tiers to offer and what governance each needs
      - Tiers and governance to be worked out with Priya Shah, Morgan Blake, and Chris Nguyen
      - No tier model was fixed in this meeting — direction only
    bad_example: |
      ### App hosting tiers

      - Talked about hosting
      - Various options discussed
      - See recording for details

anti_patterns:
  - name: Transcript-level detail in notes
    description: >
      Copying discussion play-by-play into the notes column. Minutes are a
      summary, not a transcript. If the full discussion is needed, link to the
      recording — do not reproduce it as notes.
    bad_example: |
      Notes: "First Jordan raised the question of whether to use PAT or OAuth. Alex said they preferred PAT because it is simpler. Jordan agreed but noted that OAuth might be needed later. After some back and forth they decided to go with PAT for now."
    good_example: |
      Notes: "API-first approach chosen / PAT auth preferred for V1 — OAuth deferred"

  - name: Unattributed action items
    description: >
      Recording an action without a named owner. "The team", "TBD", "everyone",
      or an empty owner are all violations of the ACTION_ITEM_ATTRIBUTION
      directive. The pipeline will refuse to return final minutes or publish
      while unattributed actions remain.
    bad_example: |
      Actions: "The team — document PAT setup"
      Actions: "TBD — review OAuth options"
    good_example: |
      Actions: "Alex Rivera — document PAT setup guide (by Friday)"

  - name: Missing or wrong section order
    description: >
      Decision minutes: omitting a section or changing the order violates the
      format contract and makes the chat response harder to scan. When
      optionally published, the wrong order also breaks wiki task
      roll-up. Discussion notes have their own fixed order — Attendance, Topics
      Discussed, then an OPTIONAL Action Items section — where omitting Action
      Items is correct when nothing actionable arose (it is not a missing
      section). Reordering or renaming the mandatory sections is still a
      violation in either format.
    bad_example: |
      Decision minutes — Sections: Action Items / Attendance / Minutes
      Discussion notes — Sections: Topics Discussed / Attendance
    good_example: |
      Decision minutes — Sections: Attendance / Minutes / Action Items
      Discussion notes — Sections: Attendance / Topics Discussed [/ Action Items if any]

  - name: Narrating existing state as a decision
    description: >
      Populating the Decisions column with facts about how things already work,
      or plans already in motion, as if they were decided in this meeting. A
      decision is something the group resolved or agreed upon during the
      meeting itself. Pre-existing policy, current architecture, and
      informational context belong in the Notes column — not Decisions.
      Knowledge-sharing and demo sessions will typically have empty Decisions
      cells for most or all agenda items; that is correct and expected.
    bad_example: |
      Agenda item: "managed container overview" (presenter walking through existing setup)
      Decisions: "Managed containers chosen as the hosting platform for idle services"
      — Wrong: this was not decided in the meeting; it is existing infrastructure being explained.

      Agenda item: "Infrastructure as code" (presenter explaining current practice)
      Decisions: "Terraform is the IaC standard; manual infrastructure deployment is not used"
      — Wrong: this is current practice being documented, not a decision reached today.
    good_example: |
      Agenda item: "managed container overview" (presenter walking through existing setup)
      Decisions: (empty)
      Notes: "Apps hosted on a managed container service / Scales to zero when idle — no cost when unused"

      Agenda item: "App hosting tiers" (discussion with directional outcome)
      Decisions: "Template repositories + shared CI library identified as the integration mechanism — tiers and governance to be defined with Priya Shah, Morgan Blake, and Chris Nguyen"

  - name: Forcing a discussion meeting into the decision table
    description: >
      Cramming a discussion- or knowledge-sharing meeting into the five-column
      Minutes table, leaving most Decisions and Action cells empty, produces a
      sparse record that reads worse than a topic summary. When the meeting was
      about exploring topics rather than reaching decisions, select the
      discussion-notes format instead of half-filling the decision table.
    bad_example: |
      | # | Agenda Item | Notes | Decisions | Presenter |
      | 1 | Container overview | scales to zero | | Alex |
      | 2 | Hosting tiers | discussed options | | Jordan |
      — Wrong: a discussion recap squeezed into the decision table with empty Decisions.
    good_example: |
      ### Managed container overview
      - Apps run on a managed container service — no VM upkeep
      - Services scale to zero when idle, so idle tools cost nothing
      - Cold-start latency is the main trade-off of scale-to-zero

  - name: Empty or ownerless Action Items in discussion notes
    description: >
      In the discussion-notes format the Action Items section is optional. Do
      not emit an empty table or a "no actions" placeholder — omit the whole
      section when nothing actionable arose. Conversely, if an action IS listed
      it must still have a named owner; optional does not mean unattributed.
    bad_example: |
      ## Action Items

      | Owner | Action | Deadline |
      |-------|--------|----------|
      | | (none this meeting) | |
      | The team | follow up on hosting | |
    good_example: |
      (No actions arose, so the Action Items section is omitted entirely.)

      — or, when an action did arise —

      ## Action Items

      | Owner | Action | Deadline |
      |-------|--------|----------|
      | Alex Rivera | share the cold-start numbers | |

references:
  - packs/built-in/directives/047-audience-oriented-writing.directive.yaml
