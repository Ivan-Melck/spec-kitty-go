schema_version: "1.0"
id: meeting-minutes-pipeline
name: Meeting Minutes Pipeline
purpose: >
  Convert a VTT meeting transcript into structured, validated Markdown minutes
  and post them as the assistant response in the originating chat. The
  pipeline supports two output formats and asks the user which to use, before
  agenda resolution or extraction: DECISION MINUTES (Attendance / Minutes table
  / Action Items, for decision- and action-oriented meetings) and DISCUSSION
  NOTES (Attendance / Topics Discussed / optional Action Items, a stand-alone
  briefing for discussion-oriented meetings). The already-running chat agent
  performs extraction; chat-only delivery requires no API key, PAT, or
  wiki publish credentials. Validated Markdown in that chat is the canonical
  content. Wiki/knowledge-base publication is an optional human-operated
  follow-up: it runs only when the user explicitly requests it and identifies
  the destination, and it reuses the same validated Markdown. `.minutes.json`
  and `.wiki.txt` are not mandatory outputs.
entry_condition: >
  A .vtt transcript from Teams or Zoom is available, or the transcript has been
  pasted into the originating chat. No API key is required. Publish-surface
  credentials are required only if the user later requests optional publishing
  and the human will operate that target.
exit_condition: >
  One validated Markdown response has been posted in the originating chat,
  in the user-selected format and titled accordingly ("{Meeting Name} —
  Minutes" for decision minutes, "{Meeting Name} — Discussion Notes" for
  discussion notes). Every action item that is present has a named owner (for
  discussion notes the Action Items section may be omitted when nothing
  actionable arose). Any attribution gaps were resolved in the same chat
  before the final response was returned. If the user explicitly requested
  publishing and identified the destination, the same validated Markdown has
  been rendered for the human to create or update on that wiki/knowledge-base.

steps:

  - title: Select minutes format
    actor: agent
    description: >
      Before agenda resolution or extraction, ask the user which of the two
      formats to produce (see meeting-minutes-format styleguide):
      (1) DECISION MINUTES — the executive record with a Minutes table
      (Notes / Decisions / Presenter) and a mandatory-attribution Action Items
      table; best for decision- and action-oriented meetings.
      (2) DISCUSSION NOTES — per-topic bullet summaries that stand alone as a
      briefing for someone who was not there (or needs a refresher), with an
      OPTIONAL Action Items section; best for discussion- and
      knowledge-sharing meetings.
      Always ask; do not assume. You MAY suggest a default from a quick scan of
      the transcript (clear decisions and owned actions ⇒ decision minutes;
      exploratory topic discussion with few or no decisions ⇒ discussion
      notes), but the user's choice governs. Record the selected format before
      proceeding; every downstream step branches on it.

  - title: Resolve the agenda (optional)
    actor: agent
    description: >
      Check whether an agenda.yaml file is available for the meeting. If it
      exists, load it — it provides numbered agenda items with titles and
      presenters that structure the extraction. If no agenda exists, proceed
      in discovery mode: infer 3–8 major topics directly from the transcript.
      Record which mode is being used before proceeding. Agenda structure maps
      to rows of the decision-minutes Minutes table or to "### {Topic}"
      headings in discussion notes; discovery mode (topic inference) is the
      norm for discussion notes even when a loose agenda exists.

  - title: Parse the VTT transcript
    actor: agent
    description: >
      Parse the .vtt file (or the pasted transcript) into utterances with
      speaker labels and timestamps. Confirm the number of utterances and
      speakers found. If the transcript exceeds 80,000 characters it will be
      truncated before extraction — note this to the user if it occurs, as
      truncation may cause the tail of long meetings to be missed.

  - title: Extract structured minutes
    actor: agent
    description: >
      Using the already-running chat agent, extract minutes with scribe-style
      neutrality, the transcript, and the agenda (or discovery instruction).
      Capture meeting_name and attendees in both formats, then branch by the
      selected format:
      - DECISION MINUTES: capture agenda_items, each with notes (3–4 executive
        phrases), decisions (outcome only, may be empty), and actions.
      - DISCUSSION NOTES: capture topics, each with a title, optional
        presenter, and a bullet summary (complete phrases, ~3–7 bullets,
        covering what was discussed, the reasoning, and where it landed /
        open questions), plus any actions that arose (may be none).

      Model selection: minutes extraction is mid-complexity structured-output
      work; use a mid-capability model. Do not require an extra provider API
      key or any wiki publish credential for this
      stage — the chat agent already in session is sufficient.

      If extraction is structurally unusable, stop. Do not return partial or
      unvalidated minutes as the final response. Surface the problem to the
      user for diagnosis.

  - title: Validate extracted minutes (pre-render)
    actor: agent
    description: >
      Before rendering, validate the structured extraction:
      - Completeness (decision minutes): meeting_name, attendees, and
        agenda_items with notes, decisions, and actions are present as required.
      - Completeness (discussion notes): meeting_name, attendees, and topics
        each with a title and a non-empty bullet summary are present. Actions
        are optional and may be absent.
      - Attribution (ACTION_ITEM_ATTRIBUTION): every action item that is
        present has a named owner in "Owner Name — task" format. This applies
        to both formats. In discussion notes the absence of actions is valid;
        an ownerless action is not.

      The attribution check is a hard gate whenever any action exists. If it
      fails, present the list of unattributed actions in the same originating
      chat. The user must either provide the missing owner names or confirm the
      actions should be removed. Do not render, return final minutes, or
      publish while any action remains unowned.

  - title: Render Markdown, validate the rendered document, then post
    actor: agent
    description: >
      Render the pre-validated minutes using the template that matches the
      selected format, as the canonical scaffold, per the
      meeting-minutes-format styleguide:
      - DECISION MINUTES → templates/writing/meeting-minutes.md, titled
        "{Meeting Name} — Minutes".
      - DISCUSSION NOTES → templates/writing/meeting-discussion-notes.md,
        titled "{Meeting Name} — Discussion Notes".

      After rendering and before posting, validate the actual Markdown against
      that styleguide for the selected format:
      - Decision minutes: title "{Meeting Name} — Minutes"; sections in order
        Attendance, Minutes, Action Items; Minutes table columns #, Agenda
        Item, Notes, Decisions, Presenter; Action Items columns Owner, Action,
        Deadline.
      - Discussion notes: title "{Meeting Name} — Discussion Notes"; sections
        Attendance then Topics Discussed (one "### {Topic}" heading + bullet
        list each), and an Action Items section ONLY if actions arose (with
        columns Owner, Action, Deadline). Do not emit an empty Action Items
        table. Per topic: a non-empty title; 3–7 complete-phrase bullets (fewer
        only for a genuinely brief topic, more only with explicit reason); each
        topic conveys the subject AND an outcome or open question; reject vague
        placeholder bullets ("talked about X", "various options discussed",
        "see recording"). Semantic adequacy (stand-alone readability,
        MINUTES_STAND_ALONE) remains a review criterion beyond these checks.

      Post-render attribution re-check (both formats, hard gate): for every row
      actually present in a rendered Action Items table, re-verify the Owner
      column holds a specific named person — reject empty, "TBD", "the team",
      "everyone", or any non-name. Rendering must not silently drop or
      de-attribute an action that passed the pre-render gate: every action
      extracted earlier must appear rendered with its named owner, or have been
      explicitly removed after the user confirmed removal. This re-check applies
      to the optional discussion-notes Action Items section exactly as to the
      decision-minutes one.

      If the rendered Markdown fails any check, fix the rendering and re-check.
      The attribution gate from the previous step remains in force — do not post
      while any rendered action is unowned. Then post the Markdown as the
      assistant response in the originating chat.

      This chat Markdown is the canonical content. Do not write `.minutes.json`
      or `.wiki.txt` as mandatory outputs. A local file is optional only if the
      user explicitly asks to save a copy. Always return the validated Markdown
      in the originating chat, including when optional wiki publishing
      will follow.

  - title: Optional — render for human-operated wiki publish
    actor: agent
    description: >
      Skip this step unless the user explicitly requests publishing to a
      wiki/knowledge-base and identifies the destination. Do not invent a
      destination. Chat-only runs end after the Markdown is posted and require
      no publish credentials.

      Reuse the same validated Markdown already posted in chat
      (extract-then-publish-separation). Do not re-extract and do not invoke
      the LLM. If this chat does not already hold that Markdown, ask the user
      to paste it. If they provide a transcript instead, treat it as a new
      minutes run.

      Render the checked minutes to the target's storage/markup format for the
      human to create or update (idempotent create-or-update). Publishing is a
      human-operated step. When credentials for that surface are used, they
      must be least-privilege and must never be logged or echoed. Attribution
      and format validation must already have passed.

  - title: Confirm and close
    actor: agent
    description: >
      In the same chat, confirm that the Markdown was posted, which format was
      produced (decision minutes or discussion notes), that every action item
      present has a named owner, and that stand-alone readability was checked
      (MINUTES_STAND_ALONE). If the transcript was truncated, restate that in
      the confirmation. If optional wiki render ran, confirm that the rendered
      page is ready for the human to publish and that no credential appeared
      in output.

anti_patterns:

  - name: Rendering without selecting a format
    description: >
      Defaulting to decision minutes (or discussion notes) without asking. The
      format materially changes the structure and what counts as complete. Ask
      the user which format up front; a transcript-based suggestion is allowed,
      but the user chooses. A discussion meeting rendered as a decision table
      (mostly empty Decisions and Action cells) is a format-selection failure,
      not a content failure.

  - name: Returning final minutes while attribution gaps remain
    description: >
      Unowned action items cannot be followed up. If validation finds a gap,
      ask in the same chat and wait for names or removal confirmation. Do not
      invent owners, do not return the final Markdown, and do not hand off for
      publishing until the gate passes.

  - name: Treating JSON or wiki publish as mandatory delivery
    description: >
      Canonical delivery is one Markdown response in the originating chat.
      Saving `.minutes.json` / `.wiki.txt` or publishing to a wiki is optional
      and user-requested only. Never block chat delivery on publish credentials.

  - name: Publishing without the validated Markdown in this chat
    description: >
      Optional wiki publishing reuses Markdown the user has already seen. If
      this chat does not hold that Markdown, ask them to paste it. Do not
      silently re-extract. Providing a transcript instead starts a new minutes
      run, not a shortcut to publish.

  - name: Calling the LLM from inside the optional publish step
    description: >
      Optional publication is deterministic. The validated Markdown is the
      authoritative input. Merging extraction and publishing removes the
      validation gate between them.

  - name: Requiring an API key for an already-running chat agent
    description: >
      The chat agent already in session performs extraction. Do not block
      chat-only delivery on an extra provider API key or wiki publish credentials.

  - name: Treating truncation silently
    description: >
      If the transcript is truncated at 80,000 characters, the tail of the
      meeting is dropped before extraction. This must be surfaced to the
      user, not silently accepted. Long meetings may require the user to split
      the transcript or run the pipeline in sections.

references:
  - type: directive
    id: DIRECTIVE_003
  - type: directive
    id: DIRECTIVE_047
  - type: directive
    id: DIRECTIVE_050
  - type: directive
    id: ACTION_ITEM_ATTRIBUTION
  - type: directive
    id: MINUTES_STAND_ALONE
  - type: styleguide
    id: meeting-minutes-format
  - type: paradigm
    id: extract-then-publish-separation
    reason: >
      Chat extraction and optional human-operated wiki publish stay separate.
      Validated Markdown in the originating chat is canonical.
